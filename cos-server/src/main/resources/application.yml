server:
  port: 8080

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    driver-class-name: ${cos.datasource.driver-class-name}
    url: jdbc:mysql://${cos.datasource.host}:${cos.datasource.port}/${cos.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: ${cos.datasource.username}
    password: ${cos.datasource.password}
  redis:
    host: ${cos.redis.host}
    port: ${cos.redis.port}
    database: ${cos.redis.database}
  jackson:
    time-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    # 这里的 SNAKE_CASE 是给 C 端用的：/api/app/** 的契约与 cof_sys 代码都以下划线字段为准
    # （如 sku_id / pickup_code / created_at）。
    # 管理端 /admin/** 由 JacksonNamingConfig 单独接管成驼峰，因为管理端契约
    # （管理端-API联调用例.md / postman 集合 / admin-web）用的是 camelCase
    # （realName / orderNo / warnStock / categoryId ...）。
    property-naming-strategy: SNAKE_CASE
  ai:
    # ---------- AI 助手（小卡）· Spring AI 官方 DeepSeek 支持 ----------
    # 总开关：spring.ai.model.chat=deepseek 时 Spring AI 才会装配 DeepSeekChatModel。
    # **没配 key 时必须置 none** —— DeepSeekApi 的构造里 Assert.hasText(apiKey)，
    # 硬装配会让应用起不来。置 none 则整个自动装配跳过，服务照常启动，小卡走「本地规则兜底」。
    # 上 key 时两个变量一起给：AI_CHAT_MODEL=deepseek  DEEPSEEK_API_KEY=sk-xxx
    model:
      chat: ${AI_CHAT_MODEL:none}
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      # 两个平台二选一（wire 协议一致，都是 OpenAI 兼容，DeepSeek starter 两边都能用）：
      #   · 阿里云百炼（本项目当前 key 所属，DeepSeek 是它托管的模型之一）
      #       base-url = https://dashscope.aliyuncs.com/compatible-mode/v1   model = deepseek-v3 / deepseek-r1
      #   · DeepSeek 官方
      #       base-url = https://api.deepseek.com                            model = deepseek-chat
      # ⚠️ 换平台时 base-url 和 model 必须一起换，只改一个是 404/模型不存在的高发原因。
      base-url: ${DEEPSEEK_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-v3}
          temperature: 0.7
          max-tokens: 800
    # 模型调用重试：官方默认 10 次指数退避（最长 3 分钟）——那是批处理口径，
    # 放在「顾客盯着等回复」的对话接口上就是灾难。压到 2 次快速失败，交给本地兜底接盘。
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 500ms
        max-interval: 2s

mybatis-plus:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.vincent.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      vincent:
        mapper: debug
        service: info
        controller: info

cos:
  jwt:
    # 设置jwt签名加密时使用的秘钥（JJWT 0.12.5 要求 HMAC 密钥 >= 256 bits / 32 字节）
    admin-secret-key: itcast-admin-jwt-secret-key-20260913-vincent-001
    # 设置jwt过期时间
    admin-ttl: 7200000
    # 设置前端传递过来的令牌名称
    admin-token-name: token
    user-secret-key: jingsen-user-jwt-secret-key-20260913-vincent-001
    user-ttl: 7200000
    user-token-name: authentication
  alioss:
    endpoint: ${cos.alioss.endpoint}
    access-key-id: ${cos.alioss.access-key-id}
    access-key-secret: ${cos.alioss.access-key-secret}
    bucket-name: ${cos.alioss.bucket-name}
  wechat:
    appid: ${cos.wechat.appid}
    secret: ${cos.wechat.secret}
  ai:
    # C 端 AI 助手（小卡）的**业务**开关。
    # 连接/模型相关的配置（api-key、base-url、model、temperature、max-tokens、重试）
    # 一律走 spring.ai.deepseek.*（见 spring 段），不在这里另起一套，免得两边漂移。
    # 总开关：置 false 可强制走本地兜底（用来对比效果或演练降级）
    enabled: true
    # 上下文体量控制：历史最多 8 条、商品清单最多 60 个、单轮最多 3 商品 + 2 券
    max-history: 8
    catalog-size: 60
    max-products: 3
    max-coupons: 2